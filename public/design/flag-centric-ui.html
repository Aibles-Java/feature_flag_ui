function viewOverview() {
  const go = (label, href, set, cls = '') => `<a class="btn sm ${cls}" href="${href}" ${set ? `data-act="go" data-set="${set}" data-href="${href}"` : ''}>${label}</a>`;
  const card = (h, p, links, refs) => `<article class="card"><h3>${h}</h3><p>${p}</p><div class="links">${links}</div><p class="refs">${refs}</p></article>`;
  const stg = ENVS[1].id, prod = PROD_ID;
  return {
    title: 'Flag-centric UI prototype',
    crumbs: [['Acme Bank (demo)'], ['Mobile Banking'], ['Prototype overview', null, true]],
    html: `
    <section class="card hero" aria-labelledby="h1"><h1 id="h1" tabindex="-1">Flags first, environments as columns</h1>
      <p>Today people walk organisation, project, environment, then flags. In the domain a flag belongs to the project and carries one state per environment, so this design makes the flag the thing you navigate to and turns environments into columns, a filter, and cards on a flag.</p>
      <p>Everything here is clickable and uses synthetic data. Use <b>Controls</b> in the top bar to change the role, the Production change window, the backend phase or the server's answers.</p></section>
    <h2 class="sec">The eight screens</h2>
    <div class="map">
      ${card('Flags matrix', 'Flag by environment, read-only states, lazy loading with at most 6 requests at once, pages of up to 100, and every empty, error and forbidden state.',
        go('Open matrix', '#/flags') + go('Page 2 at 100 per page', '#/flags?size=100&page=2') + go('Loading', '#/flags', 'data=loading', '') + go('Empty', '#/flags', 'data=empty') + go('Error 500', '#/flags', 'data=error500') + go('Rate limited', '#/flags', 'data=error429') + go('Forbidden', '#/flags', 'data=forbidden') + go('Staging column fails', '#/flags', 'data=partial'),
        'S-1.4a, S-1.5, D-18, D-20; §6.1, §6.2')}
      ${card('Focus mode', 'One environment expands to value, rollout, last evaluated and version. A quick toggle exists only for boolean flags outside Production.',
        go('Focus Staging', '#/flags?env=' + stg, 'data=ok') + go('Focus Production', '#/flags?env=' + prod, 'data=ok') + go('Bad ?env= in link', '#/flags?env=not-a-uuid', 'data=ok') + go('Toggle conflict', '#/flags?env=' + stg, 'conflictNext=true;phase=2;data=ok'),
        'S-1.4b, S-1.2; §6.1, ADR-01; T-UI-ENV')}
      ${card('Flag detail', 'Header with key, type and expiry, one card per environment, and a History tab that arrives in phase 2.',
        go('Open flag', '#/flags/f001', 'data=ok') + go('Unknown flag (404)', '#/flags/zzz', 'data=ok'),
        'S-1.7, S-2.17; §5.1, §6.1')}
      ${card('FlagStateEditor', 'Enabled, rollout, and a value field per type: boolean, string, integer, JSON. Includes secret warnings and the request preview. The string sample holds markup that is shown as text.',
        go('Boolean', '#/flags/f001?demo=edit', 'data=ok') + go('Integer', '#/flags/f002?demo=edit', 'data=ok') + go('String with markup', '#/flags/f003?demo=edit', 'data=ok') + go('JSON', '#/flags/f004?demo=edit', 'data=ok'),
        'S-1.8; §6.2, §6.4, §8.4, ADR-05')}
      ${card('ProdGuardDialog', 'Diff, change window as the server reports it, OWNER-only note, typed key and a tick. Not a four-eyes approval, and it says so.',
        go('Window open', '#/flags/f001?demo=guard', 'win=open;role=OWNER;data=ok') + go('Outside window', '#/flags/f001?demo=guard', 'win=closed;role=OWNER;data=ok') + go('No window set', '#/flags/f001?demo=guard', 'win=none;role=OWNER;data=ok') + go('As ADMIN (server refuses)', '#/flags/f001?demo=guard', 'win=open;role=ADMIN;data=ok'),
        'S-1.9, S-2.18; §7, §8.2, D-03, D-15')}
      ${card('Version conflict (409)', 'Another person saved first. Your change is shown beside the latest state, with Reload latest as the main action.',
        go('From the editor', '#/flags/f001?demo=conflict', 'phase=2;role=OWNER;data=ok') + go('From a quick toggle', '#/flags?env=' + stg, 'phase=2;conflictNext=true;role=OWNER;data=ok'),
        'S-2.16; §6.2 (after ADR-07), §6.5; ADR-07')}
      ${card('Sidebar', 'No environment switcher. "Flags" sits under the project, beside Environments and Project access. A link to ?env= survives a reload.',
        '<button type="button" class="btn sm" data-act="pulseNav">Highlight it</button>',
        'S-1.3, S-1.11; §5.1, F2')}
      ${card('Token and colour legend', 'Hex values mapped to tokens, light and dark values, and live contrast measurements.', go('Open legend', '#/legend'), 'S-1.10, F15')}
    </div>
    <h2 class="sec">Choices to confirm</h2>
    <ul class="prose">
      <li>Focus mode hides the other environment columns instead of keeping them narrow. §6.1 says the chosen column "expands"; hiding the rest keeps the request count to one column (§6.2, D-20).</li>
      <li>The quick toggle never appears for Production, even for OWNER (S-1.4b, risk table §11). Production is changed only from the flag detail, through the guard dialog.</li>
      <li>The conflict dialog also offers "re-apply my edits". §6.2 only asks for rollback, reload and a diff; re-apply avoids retyping a long JSON value.</li>
      <li>The History tab is drawn with a "Phase 2" label. §10 says phase 1 has no history.</li>
      <li>Muted text is darker than the app's #64748B because that value fails 4.5:1 on muted surfaces (legend, table 2). The Enabled pill changes from white-on-green to a soft fill for the same reason.</li>
      <li>Dark theme: slate-tinted, to match the navy brand. The app's current <code>.dark</code> block is neutral grey and nothing in the app sets it.</li>
      <li>Time zone and window hours are mock values sent by the "server". The real zone is unverified (F20, Q9).</li>
      <li>The secret hint on values is a simple pattern check, advisory only. §6.4 allows a pattern hint later; D-10 says warn in the UI and never block.</li>
    </ul>
    <p class="spec" id="sources">Sources: docs/flag-centric/solution-design.md §5, §5.1, §6.1, §6.2, §6.3 (items 1, 4, 5, 9), §6.4, §6.5, §7, §8.1, §8.2, §8.3, §8.4, ADR-01, ADR-02, ADR-05, ADR-07; plan/backlog.md S-1.1 to S-1.11, S-2.15 to S-2.18, D-03, D-05, D-09, D-10, D-12, D-15, D-18, D-19, D-20; design-walkthrough-notes.md. Visual language: src/index.css, AppLayout.tsx, FlagsPage.tsx, EnvironmentsPage.tsx.</p>`,
    mount() {
      ACTIONS.pulseNav = () => {
        if (window.matchMedia('(max-width:900px)').matches) setNav(true);
        const n = $('#navFlags'); if (!n) return; n.scrollIntoView({ block: 'center' }); n.classList.remove('sb-pulse'); void n.offsetWidth; n.classList.add('sb-pulse'); n.focus();
        toast('The Flags entry sits under the project. There is no environment switcher any more.');
      };
    },
  };
}

/* ==========================================================================
   Screen 7: sidebar (S-1.3) and shell, router, controls
   ========================================================================== */
const ACTIONS = {
  toast(a) { toast(esc(a.dataset.msg)); },
  closeNav() { setNav(false); },
  recover() { S.data = 'ok'; syncControls(); route(true); toast('Loaded the flags.', { kind: 'ok' }); },
  go(a) {
    (a.dataset.set || '').split(';').filter(Boolean).forEach((p) => { const [k, v] = p.split('='); const prevData = S.data; S[k] = v === 'true' ? true : v === 'false' ? false : v; if (k === 'data' && (prevData === 'partial' || v === 'partial')) { CELLS = {}; partialHealed = false; } });
    syncControls();
    if (a.dataset.href === location.hash) route(); else location.hash = a.dataset.href;
  },
};

function renderSidebar(rname) {
  const onFlags = rname === 'flags' || rname === 'detail';
  const proj = (n) => `<button type="button" class="sb-item" data-act="toast" data-msg="Only Mobile Banking has data in this prototype.">${icon('folder')}<span class="grow">${n}</span></button>`;
  $('#sbNav').innerHTML = `
    <p class="sb-label">Projects</p>
    <button type="button" class="sb-item active" data-act="toast" data-msg="Project is already selected.">${icon('folder')}<span class="grow">Mobile Banking</span>${icon('chev-r', 'sm')}</button>
    <div class="sb-sub">
      <a class="sb-item" id="navFlags" href="#/flags" ${onFlags ? 'aria-current="page"' : ''}>${icon('flag', 'sm')}<span class="grow">Flags</span></a>
      <button type="button" class="sb-item" data-act="toast" data-msg="Environments is unchanged (/projects/:p). Keys and protection rules stay there.">${icon('layers', 'sm')}<span class="grow">Environments</span></button>
      <button type="button" class="sb-item" data-act="toast" data-msg="Project access is unchanged in this release.">${icon('usercog', 'sm')}<span class="grow">Project access</span></button>
    </div>
    ${proj('Savings Core')}${proj('Cards Platform')}
    <p class="sb-label" style="padding-top:16px">Administration</p>
    <button type="button" class="sb-item" data-act="toast" data-msg="Members is unchanged in this release.">${icon('users')}<span class="grow">Members</span></button>
    <button type="button" class="sb-item" data-act="toast" data-msg="Custom roles is unchanged in this release.">${icon('key')}<span class="grow">Custom roles</span></button>
    <button type="button" class="sb-item" data-act="toast" data-msg="Audit log is unchanged in this release.">${icon('scroll')}<span class="grow">Audit log</span></button>`;
}

function renderCrumbs(list) {
  $('#crumbs').innerHTML = list.map(([label, href, cur], i) => {
    const sep = i ? icon('chev-r', 'sm') : '';
    if (cur) return `${sep}<span class="cur" aria-current="page">${esc(label)}</span>`;
    return `${sep}${href ? `<a href="${href}">${esc(label)}</a>` : `<button type="button" data-act="toast" data-msg="Navigation above the project is unchanged.">${esc(label)}</button>`}`;
  }).join('');
}

function setNav(open) {
  $('#sidebar').classList.toggle('open', open); $('#backdrop').classList.toggle('show', open);
  const b = $('#menuBtn'); b.setAttribute('aria-expanded', open); b.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  if (open) { const f = $('#sidebar a,#sidebar button,#sidebar select'); f && f.focus(); } else if (window.matchMedia('(max-width:900px)').matches) b.focus();
}

function parseHash() {
  const raw = location.hash.slice(1) || '/overview', i = raw.indexOf('?');
  return { path: i < 0 ? raw : raw.slice(0, i), q: new URLSearchParams(i < 0 ? '' : raw.slice(i + 1)) };
}

function route(keepScroll) {
  const { path, q } = parseHash();
  viewGen++; ST = null;
  let name, v, m;
  if (path === '/overview' || path === '/') { name = 'overview'; v = viewOverview(); }
  else if (path === '/flags') { v = viewFlags(q); name = q.get('env') ? 'focus' : 'flags'; }
  else if ((m = path.match(/^\/flags\/([\w-]+)$/))) { name = 'detail'; v = viewDetail(m[1], q); }
  else if (path === '/legend') { name = 'legend'; v = viewLegend(); }
  else { name = 'overview'; v = { ...viewOverview(), title: 'Page not found', html: `<div class="card"><div class="state" role="alert"><div class="big warn">${icon('alert', 'xl')}</div><h2 id="h1" tabindex="-1">Page not found</h2><p>This prototype has no screen at <code>${esc(path)}</code>.</p><div class="acts"><a class="btn primary" href="#/overview">Go to overview</a></div></div></div>` }; }
  $('#view').innerHTML = v.html;
  renderSidebar(name); renderCrumbs(v.crumbs);
  $$('#protoNav a').forEach((a) => (a.dataset.r === name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  document.title = v.title + ' · Flag-centric UI prototype';
  v.mount();
  setNav(false);
  if (!keepScroll) { window.scrollTo(0, 0); const h = $('#h1'); h && h.focus({ preventScroll: true }); }
}

/* Controls */
function syncControls() {
  $('#c-data').value = S.data; $('#c-role').value = S.role; $('#c-win').value = S.win; $('#c-phase').value = S.phase;
  $('#c-conflict').checked = S.conflictNext; $('#c-fail').checked = S.failNext;
  $('#c-conflict').disabled = S.phase === '1';
  $('#roleLbl').textContent = S.role;
}
function bindControls() {
  const btn = $('#ctlBtn'), panel = $('#controls');
  const toggle = (open) => { panel.hidden = !open; btn.setAttribute('aria-expanded', open); if (open) $('#c-data').focus(); };
  btn.onclick = () => toggle(panel.hidden);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!panel.hidden && !$('#modalRoot').children.length) { toggle(false); btn.focus(); } else if ($('#sidebar').classList.contains('open')) setNav(false); } });
  panel.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'c-data') { const prev = S.data; S.data = e.target.value; if (prev === 'partial' || S.data === 'partial') { CELLS = {}; partialHealed = false; } route(true); }
    if (id === 'c-role') { S.role = e.target.value; route(true); }
    if (id === 'c-win') { S.win = e.target.value; route(true); }
    if (id === 'c-phase') { S.phase = e.target.value; if (S.phase === '1') S.conflictNext = false; route(true); }
    if (id === 'c-conflict') S.conflictNext = e.target.checked;
    if (id === 'c-fail') S.failNext = e.target.checked;
    if (e.target.name === 'theme') setTheme(e.target.value);
    syncControls();
  });
  $('#c-reset').onclick = () => { Object.assign(S, { data: 'ok', role: 'OWNER', win: 'open', phase: '2', conflictNext: false, failNext: false }); buildDB(); syncControls(); route(true); toast('Data and controls reset.', { kind: 'ok' }); };
}

/* Theme: follows prefers-color-scheme until the user chooses (manual toggle wins) */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const effectiveTheme = () => document.documentElement.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light');
function setTheme(mode) {
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode);
  try { if (mode === 'auto') localStorage.removeItem('ffui-theme'); else localStorage.setItem('ffui-theme', mode); } catch (e) { /* storage unavailable */ }
  paintTheme();
  if (parseHash().path === '/legend') route(true);
}
function paintTheme() {
  const dark = effectiveTheme() === 'dark', b = $('#themeBtn');
  b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  b.innerHTML = `${icon(dark ? 'sun' : 'moon', 'sm')}<span class="tl">${dark ? 'Light' : 'Dark'}</span>`;
  const mode = document.documentElement.getAttribute('data-theme') || 'auto';
  $$('input[name="theme"]').forEach((r) => (r.checked = r.value === mode));
}

/* ==========================================================================
   Boot
   ========================================================================== */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) { if (a.tagName === 'A' && a.dataset.act !== 'go') e.preventDefault(); ACTIONS[a.dataset.act](a, e); if (a.dataset.act === 'go') e.preventDefault(); }
});
window.addEventListener('hashchange', () => route());
mq.addEventListener && mq.addEventListener('change', () => { paintTheme(); if (parseHash().path === '/legend') route(true); });
$('#themeBtn').onclick = () => setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark');
$('#menuBtn').onclick = () => setNav(!$('#sidebar').classList.contains('open'));
buildDB(); bindControls(); syncControls(); paintTheme(); route();
</script>
</body>
</html>
