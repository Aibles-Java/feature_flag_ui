# SonarQube (self-hosted) analysis configuration.
# The project key must match the project created on your SonarQube server.
sonar.projectKey=feature_flag_ui
sonar.projectName=Onward Feature Flag UI

# Analyzed sources
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions — generated / non-source files. src/components/ui/** are vendored
# shadcn/base-ui primitives (generated, not hand-authored) — kept out of analysis.
sonar.exclusions=dist/**,node_modules/**,public/**,**/*.d.ts,**/*.config.ts,src/components/ui/**

# Test coverage (Vitest → lcov), generated by `npm run coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# UI components/pages have no unit tests yet — keep them out of the New Code
# coverage metric so the Quality Gate reflects the tested logic layer
# (stores + api). Test files themselves are excluded too.
sonar.coverage.exclusions=src/pages/**,src/components/**,src/App.tsx,src/main.tsx,**/*.test.ts
