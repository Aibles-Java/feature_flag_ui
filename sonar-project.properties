# SonarQube (self-hosted) analysis configuration.
# The project key must match the project created on your SonarQube server.
sonar.projectKey=feature_flag_ui
sonar.projectName=Onward Feature Flag UI

# Analyzed sources
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions — generated / non-source files
sonar.exclusions=dist/**,node_modules/**,public/**,**/*.d.ts,**/*.config.ts

# When tests + coverage are added later, point this at the lcov report:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
