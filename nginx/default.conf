server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (inherited by the SPA shell served via `location /`)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Runtime-generated config — must never be cached
    location = /env.js {
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build assets — safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA routing — every unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
