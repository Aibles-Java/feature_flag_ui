name: CI/CD

# CI + CD for the Onward UI, mirroring the backend's workflow shape:
#   - test    : every PR into develop/main + pushes + `v*` tags (lint + build)
#   - sonar   : self-hosted SonarQube, gated behind `test`
#   - publish : push to develop/main or a `v*` tag — build, Trivy-scan, push GHCR
#   - deploy  : push to develop / a `v*` tag / manual dispatch — pull + compose up
# One `on:` for all jobs; each job self-gates by event via `if:`.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ['v*']
  # Manual deploy of an image already in GHCR (publish is skipped on dispatch, so
  # the given version MUST already have been published by a prior tag/branch run).
  workflow_dispatch:
    inputs:
      version:
        description: 'GHCR image version to deploy, e.g. 1.2.3 or sha-abc1234 (must already exist in GHCR)'
        required: true

# Cancel superseded runs ONLY for PR events. For push-to-develop / tag / dispatch
# the deploy job runs, and a cancelled `compose up` would leave a half-applied
# stack — so those run to completion and serialize via the deploy concurrency group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint & build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # SonarQube analysis on the self-hosted runner (the Sonar server sits on the
  # internal network). Gated behind `test`. Runs on push to develop/main and on
  # non-fork PRs into develop (never tags, never PRs into main). Fork PRs lack the
  # SONAR_* secrets, so they are skipped. Mirrors the backend's sonar gating.
  sonar:
    name: SonarQube analysis
    needs: test
    if: >-
      (
        (github.event_name == 'push' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
        || (github.event_name == 'pull_request' && github.base_ref == 'develop')
      )
      && (github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate new-code / blame detection
      # `sonar.qualitygate.wait=true` makes this job fail if the Quality Gate
      # fails, so the `publish` gate below is meaningful. Project key / sources
      # come from sonar-project.properties.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # Build once with `load: true` (no push) so Trivy scans the exact bits about to
  # ship; only a clean HIGH/CRITICAL scan gets pushed to GHCR, reusing the GHA
  # layer cache. Only on a push (never a PR — forks can't be trusted with registry
  # creds) to develop/main or a `vX.Y.Z` tag, once `test` + `sonar` are green.
  publish:
    name: Publish Docker image (GHCR)
    # Gated on BOTH `test` and `sonar`. `sonar` is SKIPPED on tag pushes and fork
    # PRs; `!cancelled()` + explicit result checks allow `sonar == skipped` while
    # still blocking on `sonar == failure/cancelled`.
    needs: [test, sonar]
    if: >-
      ${{ !cancelled()
        && needs.test.result == 'success'
        && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
        && github.event_name == 'push'
        && (github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `latest` gated on the actual `main` ref (NOT metadata-action's
      # {{is_default_branch}}, which would attach it to whatever the repo default
      # is). metadata-action lowercases github.repository for the GHCR path.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (local only, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the job on any HIGH/CRITICAL not covered by .trivyignore; the image
      # above is never pushed if this fails. Scans the first computed tag (present
      # in the local daemon from the `load: true` build).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache-hit rebuild (context + Dockerfile unchanged), then push.
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Continuous deployment to the server (self-hosted runner, internal network).
  # Entry points, each gated on `publish` succeeding first:
  #   - push to develop -> rolls out the immutable `sha-<short>` tag (traceable);
  #   - `vX.Y.Z` tag    -> rolls out that release version;
  #   - workflow_dispatch -> redeploys an already-published version (also how you
  #     roll back by hand — pass a `sha-<short>` or `X.Y.Z`).
  # A failed health check auto-rolls-back to the previously-running image.
  deploy:
    name: Deploy to server (self-hosted)
    needs: publish
    if: >-
      ${{ always() &&
      (github.event_name == 'workflow_dispatch' ||
       ((github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        && needs.publish.result == 'success')) }}
    runs-on: self-hosted
    # Serialize deploys; never cancel one mid-flight.
    concurrency:
      group: deploy-ui-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Resolve the GHCR image ref for the triggering event:
      #   develop push -> `sha-<short>` (matches publish's type=sha tag)
      #   tag push     -> `X.Y.Z` (strip leading v)
      #   dispatch     -> the `version` input verbatim (accepts `X.Y.Z` or `sha-...`)
      # INPUT_VERSION is passed via env (never interpolated into the script) so the
      # untrusted input cannot inject shell.
      - name: Resolve image tag
        id: img
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="sha-${GITHUB_SHA:0:7}"
          fi
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Record the image the running container uses, so rollback can restore it.
      # Empty on the first deploy (no ff_ui yet) -> rollback is skipped.
      - name: Record currently-running image (for rollback)
        run: |
          prev="$(docker inspect -f '{{.Config.Image}}' ff_ui 2>/dev/null || true)"
          echo "PREV_IMAGE=${prev}" >> "$GITHUB_ENV"
          if [ -n "${prev}" ]; then
            echo "Currently running: ${prev}"
          else
            echo "No running ff_ui container — first deploy, rollback will be skipped."
          fi

      - name: Deploy with Docker Compose
        env:
          APP_IMAGE: ${{ steps.img.outputs.image }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Host port — set repo variable UI_PORT once the reverse proxy is decided.
          UI_PORT: ${{ vars.UI_PORT || '8080' }}
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps

      - name: Verify deployment health
        env:
          UI_PORT: ${{ vars.UI_PORT || '8080' }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${UI_PORT}/healthz" >/dev/null; then
              echo "UI is healthy."
              exit 0
            fi
            echo "Waiting for UI to become ready... ($i/30)"
            sleep 5
          done
          echo "UI did not become healthy within the timeout."
          docker compose -f docker-compose.prod.yml logs --tail=100 ui
          exit 1

      # Auto-rollback: restore the previously-running image on any failure above,
      # re-verify, then keep the job RED so the failure is surfaced. Skipped on the
      # first deploy (PREV_IMAGE empty) or when previous == new.
      - name: Roll back on failed deploy
        if: failure()
        env:
          APP_IMAGE: ${{ env.PREV_IMAGE }}
          NEW_IMAGE: ${{ steps.img.outputs.image }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          UI_PORT: ${{ vars.UI_PORT || '8080' }}
        run: |
          if [ -z "${APP_IMAGE}" ]; then
            echo "No previous image recorded (first deploy) — nothing to roll back to."
            exit 0
          fi
          if [ "${APP_IMAGE}" = "${NEW_IMAGE}" ]; then
            echo "Previous image equals the just-deployed image — no rollback needed."
            exit 0
          fi
          echo "Rolling back to ${APP_IMAGE}..."
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${UI_PORT}/healthz" >/dev/null; then
              echo "Rolled back and healthy on ${APP_IMAGE}."
              exit 0
            fi
            echo "Waiting for rollback to become ready... ($i/30)"
            sleep 5
          done
          echo "Rollback did NOT become healthy — manual intervention required."
          docker compose -f docker-compose.prod.yml logs --tail=100 ui
          exit 1
